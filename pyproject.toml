[project]
name = "review-sentiment-dashboard"
version = "0.1.0"
description = "Scrapes product reviews, scores sentiment and themes with GPT, and charts them in a web dashboard."
requires-python = ">=3.11"

[project.scripts]
reviewdash = "reviewdash.cli:app"

[tool.setuptools]
packages = ["reviewdash", "demo_store"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[batch_insert]
enabled = true
[throttle_requests]
enabled = true
[batch_insert]
enabled = true
[throttle_requests]
enabled = true