<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Sentiment</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Review Sentiment</h1>
    <span class="badge" id="analyzer-badge"></span>
    <span class="muted" id="scraped-at"></span>
  </header>

  <div class="filters" role="group" aria-label="Filters">
    <label class="sr-label"><span class="muted">Product</span>
      <select id="product" aria-label="Product"></select>
    </label>
    <div class="segmented" id="range" role="group" aria-label="Date range">
      <button type="button" data-days="">All time</button>
      <button type="button" data-days="365">12 months</button>
      <button type="button" data-days="90">90 days</button>
      <button type="button" data-days="30">30 days</button>
    </div>
    <span class="spacer"></span>
    <a id="export" href="#" download>Export CSV</a>
  </div>

  <div class="stack" id="dashboard">
    <section class="card summary" id="summary" aria-live="polite"></section>
    <section class="tiles" id="tiles"></section>
    <section class="charts">
      <div class="card chart">
        <div class="card-head">
          <h2>Sentiment by month</h2>
          <button type="button" class="link-button" data-table="months">Show table</button>
        </div>
        <div class="legend" aria-hidden="true">
          <span><i class="key pos"></i>Positive</span>
          <span><i class="key neu"></i>Neutral or mixed</span>
          <span><i class="key neg"></i>Negative</span>
        </div>
        <div id="months-chart"></div>
        <div id="months-table" hidden></div>
      </div>
      <div class="card chart">
        <div class="card-head">
          <h2>Themes</h2>
          <button type="button" class="link-button" data-table="themes">Show table</button>
        </div>
        <div class="legend" aria-hidden="true">
          <span><i class="key neg"></i>Negative mentions</span>
          <span><i class="key pos"></i>Positive mentions</span>
          <span class="muted">Click a bar to filter the reviews</span>
        </div>
        <div id="themes-chart"></div>
        <div id="themes-table" hidden></div>
      </div>
    </section>
    <section class="card" id="reviews-card">
      <div class="card-head">
        <h2>Reviews <span class="muted" id="review-count"></span></h2>
      </div>
      <div class="review-filters">
        <select id="f-sentiment" aria-label="Sentiment">
          <option value="">All sentiments</option>
          <option value="positive">Positive</option>
          <option value="mixed">Mixed</option>
          <option value="neutral">Neutral</option>
          <option value="negative">Negative</option>
        </select>
        <select id="f-theme" aria-label="Theme"><option value="">All themes</option></select>
        <select id="f-theme-sentiment" aria-label="Theme sentiment">
          <option value="">praised or criticized</option>
          <option value="positive">praised</option>
          <option value="negative">criticized</option>
        </select>
        <label><input type="checkbox" id="f-mismatch"> Rating contradicts text</label>
        <input type="search" id="f-q" placeholder="Search text" aria-label="Search review text">
        <button type="button" class="link-button" id="f-clear">Clear</button>
      </div>
      <div id="reviews"></div>
      <div class="pager">
        <button type="button" id="prev">Newer</button>
        <span class="muted" id="page-info"></span>
        <button type="button" id="next">Older</button>
      </div>
    </section>
  </div>
</div>
<div class="tooltip" id="tooltip" role="status" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
<section id="aggregate_stats"></section>
<section id="aggregate_stats"></section>
<section id="init_service"></section>
